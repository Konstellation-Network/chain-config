name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ENGINEERING.md §5.2: "chain-config addresses match contracts deployments"
      # is asserted by test/invariant.test.ts against sibling checkouts of
      # `contracts` (preinstall + WKASH pins) and `konstellation` (precompile
      # addresses, chain ids, denom, embedded preinstalls). Both repos are
      # private and the job's GITHUB_TOKEN cannot read other private repos, so
      # these steps need a fine-grained PAT with contents:read on both repos
      # stored as the CONTRACTS_READ_TOKEN secret.
      #
      # A failed checkout FAILS THE JOB (the "Fail: …" steps below): a green
      # check must mean the invariant ran. `continue-on-error` on the checkout
      # itself only keeps the failure message readable. Consequences, intended:
      # - a PR from a fork has no secrets → red until re-run from an org branch;
      # - a missing/expired token → red until a maintainer sets it.
      # Once the repos are public the fallback github.token is enough and the
      # secret can go.
      #
      # `ref: vesting-d12` on contracts: the WKASH pin
      # (test/DeployWKASH.t.sol) lives on that branch until contracts PR
      # "vesting-d12" merges. Drop the `ref` line then — the checkout going red
      # when the branch is deleted is the reminder.
      - name: Check out contracts (for the §5.2 invariant test)
        id: contracts
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Konstellation-Network/contracts
          ref: vesting-d12
          token: ${{ secrets.CONTRACTS_READ_TOKEN || github.token }}
          path: .siblings/contracts
          sparse-checkout: |
            preinstalls
            test
          persist-credentials: false

      - name: "Fail: contracts could not be checked out — the §5.2 invariant cannot run"
        if: steps.contracts.outcome != 'success'
        run: |
          echo "::error::ENGINEERING.md §5.2 invariant not checked: the Konstellation-Network/contracts checkout failed. Set the CONTRACTS_READ_TOKEN secret (fine-grained PAT, contents:read on contracts and konstellation) or, for a fork PR, re-run from an org branch. See .github/workflows/ci.yml."
          exit 1

      - name: Check out konstellation (for the §5.2 invariant test)
        id: konstellation
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Konstellation-Network/konstellation
          token: ${{ secrets.CONTRACTS_READ_TOKEN || github.token }}
          path: .siblings/konstellation
          sparse-checkout: |
            app/config
            app/preinstalls
            x/compliance/precompile
          persist-credentials: false

      - name: "Fail: konstellation could not be checked out — the §5.2 invariant cannot run"
        if: steps.konstellation.outcome != 'success'
        run: |
          echo "::error::precompile addresses / chain ids not checked against konstellation: the Konstellation-Network/konstellation checkout failed. Set the CONTRACTS_READ_TOKEN secret with read access to it, or re-run from an org branch. See .github/workflows/ci.yml."
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # `npm test` runs the src tests, the §5.2 invariant against the two
      # checkouts above, and test/dist.test.ts against the dist/ just built
      # (pretest rebuilds it — cheap, and the published artifact is what
      # gets asserted, not the sources).
      - run: npm test
        env:
          KONSTELLATION_CONTRACTS_DIR: ${{ github.workspace }}/.siblings/contracts
          KONSTELLATION_CHAIN_DIR: ${{ github.workspace }}/.siblings/konstellation
          # Both checkouts succeeded if we got here; an unfindable sibling is
          # then a bug in this file, and must fail, not skip.
          KONSTELLATION_REQUIRE_SIBLINGS: "1"
      - name: Pack (dry run) — list exactly what `npm publish` would ship
        run: npm pack --dry-run
